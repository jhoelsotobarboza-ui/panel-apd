<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Ejecutivo de Fiscalizacion APD</title>
    <style>
        :root { --bg: #f2f4f8; --ink: #14213d; --mu: #56627a; --ln: #dde2ea; --f: #2457a7; --c: #b4232a; --a: #c98a0b; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0e1524; --ink: #e9edf5; --mu: #9eabc2; --ln: #2c3957; --f: #7aa5f2; --c: #ef7f85; --a: #f0b34a; } }
        html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Roboto, Arial, sans-serif; }
        .sync { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
                padding: 8px 22px; font-size: 12.5px; color: var(--mu); border-bottom: 1px solid var(--ln); }
        .sync b { color: var(--ink); }
        .sync .warn { color: var(--a); }
        .sync .err { color: var(--c); }
        .sync a { color: var(--f); }
        @media print { .sync { display: none; } }
    </style>
</head>
<body>
    <div class="sync"><span id="sync-txt">Consultando la ultima actualizacion…</span><a href="/logout">Salir</a></div>
    <div id="dash"></div>

    <script>
        // El dashboard (dashboard.js) es el mismo que se usa en dgjcmt-apd.com. Aqui pide /api/... a este
        // servidor, que responde con la copia enviada por la extension "Puente SIC - Panel APD".
        try { localStorage.setItem("token", "panel"); } catch (e) {}

        function fecha(iso) {
            if (!iso) return "—";
            var d = new Date(iso);
            return d.toLocaleDateString("es-PE") + " " + d.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
        }

        fetch("/api/estado", { cache: "no-store" }).then(function (r) {
            if (r.status === 401) { location.href = "/login"; throw new Error("sesion"); }
            if (!r.ok) throw new Error("El servidor del panel respondio con error HTTP " + r.status + ".");
            return r.json();
        }).then(function (s) {
            var el = document.getElementById("sync-txt");
            var base = s.error_base ? ' <span class="err">· Falla la base de datos (DATABASE_URL): ' + esc(s.error_base) + "</span>" : "";
            // Ultimo intento de la extension que no trajo datos nuevos: se muestra el motivo que informo.
            var it = s.intento && !s.intento.nuevo ? s.intento : null;
            var intento = it ? ' <span class="err">· Intento de la extension el ' + fecha(it.at) + " sin datos nuevos: " +
                esc((it.errores || []).join(" · ") || "sin detalle") + "</span>" : "";
            if (!s.datos) {
                el.innerHTML = '<span class="err">Todavia no se recibieron datos.</span> ' +
                    (it ? "" : "La extension «Puente SIC – Panel APD» aun no se ha comunicado con el panel: recarguela en chrome://extensions, pegue la clave de envio en su icono y pulse «Enviar ahora».") +
                    intento + base;
                return;
            }
            // Los envios son a las 8:00 y 17:00; si pasan mas de 16 horas, se avisa que las cifras son de un envio anterior.
            var cifras = [s.api_at, s.sic_ok ? s.sic_at : null].filter(Boolean).sort()[0] || s.recibido;
            var horas = (Date.now() - new Date(cifras).getTime()) / 3600000;
            var html = "Cifras al <b>" + fecha(cifras) + "</b> · Sistema: " + fecha(s.api_at) + " · SIC: " + (s.sic_ok ? fecha(s.sic_at) : '<span class="err">sin Excel</span>');
            if (horas > 16) html = '<span class="warn">' + html + " (hace " + Math.round(horas) + " h; se muestran las ultimas cifras guardadas)</span>";
            html += " · Ultimo envio: " + fecha(s.recibido);
            if (s.sic_error) html += ' <span class="warn">(ultimo intento de SIC fallo; se muestra el Excel anterior)</span>';
            el.innerHTML = html + intento + base;
        }).catch(function (e) {
            if (e.message !== "sesion") document.getElementById("sync-txt").innerHTML = '<span class="err">' + esc(e.message) + "</span>";
        });

        function esc(t) {
            return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
        }

        // Puente SIC: el dashboard pide el Excel con postMessage(SIC_EXT_REQ), como si estuviera la extension.
        document.documentElement.setAttribute("data-sic-bridge", "1");
        window.addEventListener("message", function (ev) {
            var d = ev.data;
            if (ev.source !== window || !d || d.type !== "SIC_EXT_REQ") return;
            var id = String(d.id || "");
            var send = function (o) { window.postMessage(Object.assign({ type: "SIC_EXT_RES", id: id }, o), location.origin); };
            fetch("/api/sic", { cache: "no-store" }).then(function (r) {
                if (r.status === 401) throw new Error("La sesion del panel vencio; vuelva a ingresar.");
                return r.json();
            }).then(function (res) {
                if (!res.ok) return send({ ok: false, error: "panel", message: res.message || "sin datos de SIC" });
                var bin = atob(res.b64), u = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
                send({ ok: true, buf: u.buffer, at: res.at, susp: res.susp || null });
            }).catch(function (e) {
                send({ ok: false, error: "panel", message: String(e.message || e) });
            });
        });

        window.__DASH_MOUNT = document.getElementById("dash");
    </script>
    <script src="/static/geo.js?v=2"></script>
    <script src="/static/mapas.js?v=2"></script>
    <script src="/static/dashboard.js"></script>
    <script>
        // En el panel los datos llegan de la extension: se quitan de la barra superior
        // «Traer de SIC Consultas» y «Cargar Excel de salas» (siguen disponibles en el aviso central),
        // el aviso «Salas actualizadas desde SIC Consultas…» (los errores de SIC si se muestran) y la
        // tarjeta de Año / Ordenar / Cambiar Excel / Quitar con las columnas del Excel.
        (function () {
            var root = document.getElementById("dash").shadowRoot;
            if (!root) return;
            var st = document.createElement("style");
            st.textContent = ".acts #sic, .acts #ux { display: none !important; }" +
                "#sicmsg .note:not(.err) { display: none !important; }" +
                "#xdash > .pn:has(#xy) { display: none !important; }";
            root.appendChild(st);
        })();
    </script>
</body>
</html>
